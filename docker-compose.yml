version: "3.9"

services:

  frontend:
    build: ./frontend
    container_name: cont_frontend

    restart: always

    expose:
      - "3000"

  backend:
    build: ./backend
    container_name: cont_backend

    restart: always

    expose:
      - "8080"

  nginx:
    image: nginx:latest
    container_name: cont_nginx

    restart: always

    ports:
      - "95:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend
