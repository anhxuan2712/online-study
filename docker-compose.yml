version: "3.9"

services:

  frontend:
    build: ./frontend
    container_name: cont_frontend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cont_backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: cont_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: online_study
    volumes:
      - mysql_data:/var/lib/mysql

  nginx:
    image: nginx:latest
    container_name: cont_nginx
    restart: unless-stopped
    ports:
      - "95:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
